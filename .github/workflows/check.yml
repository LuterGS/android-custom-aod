name: Verify v2
on:
  push:
    branches: [main, v2.0]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
