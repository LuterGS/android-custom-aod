name: Verify F-Droid build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - fdroid/metadata/**
      - .github/workflows/fdroid.yml
  push:
    branches: [main]
    paths:
      - fdroid/metadata/**
      - .github/workflows/fdroid.yml

permissions:
  contents: read

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install F-Droid tools
        # Match the formatter and YAML library used by the F-Droid GitLab CI.
        run: >-
          python -m pip install
          'git+https://gitlab.com/fdroid/fdroidserver.git@a35fdfddd9c66823987a410566a6101186e39c84'
          'ruamel.yaml==0.18.10'
      - name: Prepare F-Droid metadata and local tool paths
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          git -C "$RUNNER_TEMP/fdroiddata" sparse-checkout set config
          mkdir -p "$RUNNER_TEMP/fdroiddata/metadata"
          cp fdroid/metadata/dev.lutergs.sgaod.yml "$RUNNER_TEMP/fdroiddata/metadata/"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import yaml

          sdk = Path(os.environ['ANDROID_HOME'])
          apksigners = sorted(sdk.glob('build-tools/*/apksigner'))
          gradle = shutil.which('gradle')
          if not apksigners or not gradle:
              raise SystemExit('Android build-tools and Gradle are required')
          config = {
              'sdk_path': str(sdk),
              'apksigner': str(apksigners[-1]),
              'gradle': gradle,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'fdroiddata/config.yml').write_text(
              yaml.safe_dump(config)
          )
          PY
      - name: Check metadata and build against the published APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fdroiddata"
          fdroid readmeta
          fdroid lint -f dev.lutergs.sgaod
          fdroid build --stop --latest --scan-binary --verbose dev.lutergs.sgaod 2>&1 | tee verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdroid-verification
          retention-days: 7
          path: |
            ${{ runner.temp }}/fdroiddata/verification.log
            ${{ runner.temp }}/fdroiddata/logs/
            ${{ runner.temp }}/fdroiddata/unsigned/*.apk
